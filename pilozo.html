<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarleth</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffb6d5, #d9b3ff, #a8d8ff);
        }

        .tarjeta {
            width: 370px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(100,50,100,0.3);
        }

        .foto {
            width: 120px;
            height: 120px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6fae, #a66cff);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 55px;
            font-weight: bold;
        }

        h1 {
            margin-top: 20px;
            color: #6b3565;
            font-size: 42px;
        }

        .usuario {
            color: #a05b91;
            margin-top: 5px;
        }

        .descripcion {
            color: #666;
            margin: 25px 0;
            font-size: 16px;
        }

        .boton {
            display: block;
            text-decoration: none;
            color: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .boton:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .instagram {
            background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
        }

        .tiktok {
            background: #111111;
        }

        .whatsapp {
            background: #25D366;
        }

        footer {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="tarjeta">

        <div class="foto">
            S
        </div>

        <h1>Scarleth</h1>

        <p class="usuario">@scarleth</p>

        <p class="descripcion">
            ✨ Bienvenida a mi página personal ✨
        </p>

        <a class="boton instagram"
           href="https://www.instagram.com/scarleth_21_/"
           target="_blank">
            📷 Instagram
        </a>

        <a class="boton tiktok"
           href="https://www.tiktok.com/@scarleth.pilozo"
           target="_blank">
            🎵 TikTok
        </a>

        <a class="boton whatsapp"
           href="https://wa.me/593982570024"
           target="_blank">
            💬 WhatsApp
        </a>

        <footer>
            © 2026 Scarleth
        </footer>

    </div>

</body>
</html>
